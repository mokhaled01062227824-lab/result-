<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الاستعلام عن النتيجة</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 20px; background: #f3f5f8;
      font-family: Tahoma, Arial, sans-serif; color: #1f2937;
    }
    .card {
      width: 100%; max-width: 430px; background: #fff; padding: 28px;
      border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 10px; font-size: 25px; text-align: center; }
    .hint { text-align: center; color: #64748b; margin: 0 0 24px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; }
    input {
      width: 100%; padding: 14px; border: 1px solid #cbd5e1;
      border-radius: 10px; font-size: 20px; text-align: center;
      letter-spacing: 3px; outline: none;
    }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px #dbeafe; }
    button {
      width: 100%; margin-top: 14px; padding: 14px; border: 0;
      border-radius: 10px; background: #2563eb; color: white;
      font-size: 17px; font-weight: bold; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .result { display: none; margin-top: 22px; padding: 18px;
      border-radius: 12px; background: #eff6ff; border: 1px solid #bfdbfe; }
    .result p { margin: 9px 0; font-size: 17px; line-height: 1.7; }
    .value { font-weight: bold; color: #1d4ed8; overflow-wrap: anywhere; }
    .message { display: none; margin-top: 16px; text-align: center; color: #b91c1c; }
  </style>
</head>
<body>
  <main class="card">
    <h1>الاستعلام عن النتيجة</h1>
    <p class="hint">اكتب الكود المكوّن من 7 أرقام</p>
    <form id="searchForm">
      <label for="code">كود الطالب</label>
      <input id="code" type="text" inputmode="numeric" pattern="[0-9]{7}"
             maxlength="7" placeholder="1234567" autocomplete="off" required>
      <button type="submit">عرض النتيجة</button>
    </form>
    <section class="result" id="result" aria-live="polite">
      <p>اسم الطالب: <span class="value" id="studentName"></span></p>
      <p>النتيجة: <span class="value" id="studentGrade"></span></p>
    </section>
    <p class="message" id="message" role="alert"></p>
  </main>
